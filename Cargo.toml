[workspace]
resolver = "3"
members = ["runner", "problems", "aoc_plumbing"]
default-members = ["runner"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1

[profile.dev]
opt-level = 2
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[workspace.dependencies]
problems = { path = "problems" }
aoc_plumbing = { path = "aoc_plumbing" }

clap = { version = "4.6.7", features = ["derive"] }
rayon = "1.12.0"                                    # Only optionally used in the runner.

itertools = "0.15.0"
unscanny = "0.1"
#num = "0.4"
#petgraph = "0.8.3"
